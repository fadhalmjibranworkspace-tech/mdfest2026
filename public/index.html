<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1e6cf">
<title>Bagan MD FEST 2026</title>
<meta name="description" content="Bagan, jadwal, dan hasil semua lomba Manajemen Dakwah Festival 2026.">
<meta property="og:title" content="Bagan MD FEST 2026"><meta property="og:description" content="Pantau bagan, jadwal, dan hasil lomba MD FEST 2026."><meta property="og:image" content="/brand/og.png">
<link rel="icon" href="/brand/favicon.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/bagan.css">
</head>
<body>
<div class="app">
  <header class="hdr"><div class="hdr-in">
    <a class="stamp" href="/" aria-label="Beranda"><img src="/brand/mdfest.png" alt="MD FEST"></a>
    <a class="ht" href="/"><b>MD FEST 2026</b><small>Bagan &amp; hasil lomba</small></a>
    <span class="pill" id="pill"><span class="dot" id="dot"></span><span id="pt">Memuat…</span></span>
  </div></header>

  <main class="wrap">
    <section class="hero" id="hero">
      <div class="hero-art" id="art" aria-hidden="true"></div>
      <div class="hero-in">
        <div class="kick" id="kick"><i></i>Manajemen Dakwah Festival</div>
        <h1 class="disp" id="jd">Bagan<br><span>MD FEST 2026</span></h1>
        <p id="sj">Lihat bagan, jadwal, dan hasil semua lomba. Ketuk lomba untuk membuka bagannya.</p>
        <div class="hstats" id="hst"></div>
      </div>
    </section>
    <div class="notice" id="nt" hidden></div>

    <div id="nowSec" hidden>
      <div class="sec"><h2><i class="rec"></i>Sedang berlangsung</h2><span id="nowN"></span></div>
      <div class="now live" id="now"></div>
    </div>
    <div id="nextSec" hidden>
      <div class="sec"><h2>Pertandingan berikutnya</h2></div>
      <div class="now tix" id="next"></div>
    </div>

    <div class="sec"><h2>Semua lomba</h2><span id="cnt"></span></div>
    <div class="rail" id="chips" role="tablist" aria-label="Kategori"></div>
    <div class="lg" id="grid" style="margin-top:8px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </main>

  <footer class="ft"><span>© MD FEST 2026 · Manajemen Dakwah</span><a href="/admin">Panel panitia</a></footer>
</div>
<script src="/js/engine.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/app.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
