<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1e6cf">
<meta name="robots" content="noindex">
<title>Panel Bagan · MD FEST 2026</title>
<link rel="icon" href="/brand/favicon.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/bagan.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="app">
  <section class="login" id="login" hidden>
    <form class="card lcard" id="lf" autocomplete="on">
      <img class="lgo" src="/brand/mdfest.png" alt="">
      <h1 class="gold-t">Masuk Panitia</h1>
      <p>Kelola bagan &amp; hasil lomba MD FEST 2026</p>
      <div class="f"><label class="l" for="u">Username</label><input class="in" id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" placeholder="Masukkan username" required></div>
      <div class="f"><label class="l" for="p">Password</label><input class="in" id="p" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required></div>
      <div class="lerr" id="le" role="alert"></div>
      <button class="btn gld" style="width:100%" id="lb" data-ic="login">Masuk</button>
      <a class="back" href="/">← Kembali ke halaman publik</a>
    </form>
  </section>

  <div id="shell" hidden>
    <aside class="side" aria-label="Navigasi panitia">
      <a class="sb-brand" href="/"><img src="/brand/mdfest.png" alt=""><span><b class="gold-t">MD FEST</b><small>Panel bagan</small></span></a>
      <div class="sb-g">
        <a class="sb-i" data-r="lomba" href="#lomba" data-ic="bracket">Lomba</a>
        <a class="sb-i" data-r="pengaturan" href="#pengaturan" data-ic="gear">Pengaturan</a>
        <a class="sb-i" href="/" target="_blank" rel="noopener" data-ic="eye">Halaman publik</a>
      </div>
      <div class="sb-foot"><span class="sb-av" id="av">P</span><span style="flex:1;min-width:0"><b id="whoN" style="display:block;font-size:13.5px">Panitia</b><small style="color:var(--ink2);font-weight:700">Admin</small></span><button class="btn line ib sm" id="out" type="button" aria-label="Keluar" data-ic="logout"></button></div>
    </aside>

    <div class="main">
      <header class="top" id="top"></header>
      <main class="page" id="page"></main>
    </div>

    <div class="savebar" id="savebar"><div class="in2"><span id="sbt">Ada perubahan yang belum disimpan</span><button class="btn gho xs" id="sbx" type="button" style="color:#fcf0cf;border-color:rgba(252,240,207,.4)">Buang</button><button class="btn gld sm" id="sbs" type="button" data-ic="save">Simpan</button></div></div>

    <nav class="bn" aria-label="Navigasi">
      <a data-r="lomba" href="#lomba" data-ic="bracket">Lomba</a>
      <a data-r="pengaturan" href="#pengaturan" data-ic="gear">Pengaturan</a>
      <a href="/" target="_blank" rel="noopener" data-ic="eye">Publik</a>
    </nav>
  </div>
</div>
<script src="/js/engine.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/render.js"></script>
<script src="/js/app.js"></script>
<script src="/js/viewer.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
